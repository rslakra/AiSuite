<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat with your file · local</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body data-has-document="{{ 'true' if has_document else 'false' }}">
  <div class="wrap">
    <header>
      <h1>Chat with your file</h1>
      <span class="status"><span class="dot"></span>runs on your machine · works offline</span>
      <p class="lede">Upload a document, then ask it anything. The file never leaves your laptop.</p>
    </header>

    <section class="panel">
      <div class="panel-label">1 · Load a document</div>
      <div class="drop">
        <label class="file-btn">
          Choose file
          <input id="file" type="file" accept=".pdf,.txt,.md" hidden />
        </label>
        <span class="file-name" id="fileName">No file chosen</span>
        <button class="primary" id="uploadBtn" disabled>Build the book</button>
      </div>
      <div class="upload-note" id="uploadNote"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-label">2 · Ask about it</div>
        <div class="model-select">
          <span class="model-select-label">Model</span>
          <div class="model-picker" id="modelPicker">
            <button
              type="button"
              class="model-picker-btn"
              id="modelPickerBtn"
              aria-haspopup="listbox"
              aria-expanded="false"
              disabled
            >
              <span class="model-picker-value" id="modelPickerValue">loading…</span>
              <span class="model-picker-chevron" aria-hidden="true"></span>
            </button>
            <ul class="model-picker-menu" id="modelPickerMenu" role="listbox" hidden></ul>
          </div>
        </div>
      </div>
      <div class="messages" id="messages">
        <div class="empty" id="empty">Load a document above to start asking questions.</div>
      </div>
      <div class="composer">
        <input id="question" type="text" placeholder="Ask something about your file…" disabled />
        <button class="primary" id="sendBtn" disabled>Send</button>
      </div>
    </section>
  </div>

  <script src="/static/js/actions.js"></script>
</body>
</html>
